# On every push to main: test, build both images, push them to GitHub Container Registry (GHCR),
# then SSH into the server and restart the stack with the new images.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false      # never interrupt a deploy that is half-way through

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push images
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.owner.outputs.lower }}
    steps:
      - uses: actions/checkout@v4

      - name: Lower-case the owner (GHCR requires lower-case image names)
        id: owner
        run: echo "lower=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/skillbharat-backend:latest
            ghcr.io/${{ steps.owner.outputs.lower }}/skillbharat-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_SHOW_DEMO_LOGINS=false
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/skillbharat-frontend:latest
            ghcr.io/${{ steps.owner.outputs.lower }}/skillbharat-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    environment: production        # optional: add required reviewers under Settings > Environments
    permissions:
      contents: read
      packages: read               # the same token is used on the server to pull the private images
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy compose files and restart the stack
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ needs.build.outputs.owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          scp $OPTS -P "$PORT" docker-compose.prod.yml Caddyfile "$SSH_USER@$SSH_HOST:/opt/skillbharat/"

          ssh $OPTS -p "$PORT" "$SSH_USER@$SSH_HOST" \
            "GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' GHCR_OWNER='$GHCR_OWNER' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/skillbharat
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          export GHCR_OWNER IMAGE_TAG
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          docker compose -f docker-compose.prod.yml ps
          REMOTE
