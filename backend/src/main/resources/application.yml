server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: skillbharat-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skillbharat}
    username: ${DB_USERNAME:skillbharat}
    password: ${DB_PASSWORD:skillbharat}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Must be at least 32 characters. ALWAYS override JWT_SECRET outside local development.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-1234567890}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  storage:
    local-dir: ${STORAGE_DIR:./data/resumes}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Platform Admin}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    com.skillbharat: INFO
