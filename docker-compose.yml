# SkillBharat: PostgreSQL + Spring Boot API + React web app (served by nginx).
#   docker compose up --build
#   Web:      http://localhost:3000
#   API docs: http://localhost:8080/swagger-ui.html
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillbharat}
      POSTGRES_USER: ${POSTGRES_USER:-skillbharat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillbharat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"            # handy for local development; remove in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillbharat} -d ${POSTGRES_DB:-skillbharat}"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-skillbharat}
      DB_USERNAME: ${POSTGRES_USER:-skillbharat}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-skillbharat}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-to-a-long-random-string}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      STORAGE_DIR: /data/resumes
    volumes:
      - resumes:/data/resumes
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SHOW_DEMO_LOGINS: ${SEED_DEMO_DATA:-true}
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  resumes:
